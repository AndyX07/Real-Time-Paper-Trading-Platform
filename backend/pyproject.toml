[project]
name = "paper-trader-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn[standard]>=0.49,<0.50",
    "websockets>=16,<17",
    "pydantic>=2.13,<3",
    "httpx>=0.28,<0.29",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
